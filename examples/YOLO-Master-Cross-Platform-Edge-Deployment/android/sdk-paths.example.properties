# Copy this file to android/sdk-paths.properties (gitignored) and set your local
# SDK roots. Both are downloaded prebuilts kept OUTSIDE git (put them under the
# repo's ignored third_party/ or anywhere on disk).

# ncnn official Android prebuilt, tag 20260526, the "-android-vulkan" variant.
# Point at the directory that contains <ABI>/lib/cmake/ncnn (e.g. arm64-v8a/lib/cmake/ncnn).
# Tag 20260526 matches the desktop SDK so the .param/.bin model files are byte-parity.
NCNN_ANDROID_ROOT=/abs/path/to/ncnn-20260526-android-vulkan

# opencv-mobile Android SDK (core + imgproc; tiny, pairs with ncnn). 4.13.0 (release v36) is the current build; it needs NDK r29+ (its OpenMP symbols are not in r26-r28).
# Point at the directory that contains sdk/native/jni/OpenCVConfig.cmake.
OPENCV_ANDROID_ROOT=/abs/path/to/opencv-mobile-4.13.0-android
