# Three-task MPS ablation treatment: explicit dense MoT training.
# It shares the control model's backbone, FPN topology, output channels,
# repeat counts, and MultiTaskHead. `sparse_train: False` is positional here
# so the runtime resolver cannot silently change the dense treatment.
nc: 80
end2end: True
reg_max: 1
kpt_shape: [17, 3]
nm: 32
npr: 256
tasks: ['detect', 'segment', 'pose']

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C2fMoT, [512, 8, 2, 7, 4, 2.0, 1.0, 0.01, 0.5, False, False, None, 0.0, 0, "dynamic", 7]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C2fMoT, [256, 4, 2, 7, 4, 2.0, 0.8, 0.01, 0.5, False, False, None, 0.0, 0, "dynamic", 7]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C2fMoT, [512, 8, 2, 7, 4, 2.0, 0.8, 0.01, 0.5, False, False, None, 0.0, 0, "dynamic", 7]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C2fMoT, [1024, 8, 1, 7, 4, 2.0, 0.8, 0.01, 0.5, False, False, None, 0.0, 0, "dynamic", 7]]
  - [[16, 19, 22], 1, MultiTaskHead, [nc]]
