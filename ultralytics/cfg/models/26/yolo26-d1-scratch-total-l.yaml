# D1 total-system-parameter-matched scratch baseline.
# Standard YOLO26-L topology, width 15/16; random initialization only.
# nc=80: 23,133,560 params; nc=10: 23,032,340 params.
# Frozen-system targets include the 21,596,544-parameter DINOv3 ViT-S/16.
nc: 80
end2end: true
reg_max: 1
# Applied by the D1 Scratch factory; parameters and topology are unchanged.
fp32_attention: true
scale: l
scales:
  l: [1.0, 0.9375, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, true]]
  - [-1, 1, SPPF, [1024, 5, 3, true]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, true]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, true, 0.5, true]]
  - [[16, 19, 22], 1, Detect, [nc]]
