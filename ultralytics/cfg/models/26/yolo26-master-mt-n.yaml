# Ultralytics YOLO26-Master-MT Multi-Task Vision Model
#
# Default supervised path: detection, instance segmentation, and pose.
# Classification/depth require aligned labels; unified MultiTask OBB is unsupported (use a dedicated OBB model).
#
# MOT-inspired architecture:
#   - MoT blocks in neck: token-level routing to Transformer experts
#     (LocalConv, Window, Deformable) for adaptive multi-task features
#   - TaskRouter: routes tokens to task-specific heads (ByteTracker-style
#     two-stage routing: high-conf → task expert, ambiguous → shared)
#   - Cross-task association: feature sharing across task branches
#
# Model docs: docs/models/yolo26-mt.md
# Task docs: docs/tasks/multitask.md

# ── Parameters ───────────────────────────────────────────────────────────
nc: 80                                          # number of classes (shared)
end2end: True                                   # one2one + one2many heads
reg_max: 1                                      # DFL bins
kpt_shape: [17, 3]                              # COCO keypoints
nm: 32                                          # mask coefficients
npr: 256                                         # mask prototypes
tasks: ['detect', 'segment', 'pose']             # active supervised tasks

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ── Shared Backbone ──────────────────────────────────────────────────────
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]           # 2
  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]           # 4
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                  # 6
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                 # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]          # 9
  - [-1, 2, C2PSA, [1024]]                     # 10

# ── MoT-Enhanced Multi-Task Neck ─────────────────────────────────────────
# C2fMoT blocks replace standard C3k2 blocks for adaptive multi-task
# representation learning. Args: [c1, c2, n, num_heads, top_k, window_size,
#                                  n_points, mlp_ratio, temperature, balance_coeff]
head:
  # P5 → P4 upsampling
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                     # 12: cat backbone P4
  - [-1, 2, C2fMoT, [512, 8, 2, 7, 4, 2.0, 1.0, 0.01]]  # 13: MoT-adapted P4

  # P4 → P3 upsampling
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                     # 15: cat backbone P3
  - [-1, 2, C2fMoT, [256, 4, 2, 7, 4, 2.0, 0.8, 0.01]]  # 16: MoT-adapted P3 (detection scale)

  # P3 → P4 downsampling
  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [[-1, 13], 1, Concat, [1]]                    # 18: cat MoT P4
  - [-1, 2, C2fMoT, [512, 8, 2, 7, 4, 2.0, 0.8, 0.01]]  # 19: MoT-adapted P4

  # P4 → P5 downsampling
  - [-1, 1, Conv, [512, 3, 2]]                    # 20
  - [[-1, 10], 1, Concat, [1]]                    # 21: cat backbone P5
  - [-1, 2, C2fMoT, [1024, 8, 1, 7, 4, 2.0, 0.8, 0.01]]  # 22: MoT-adapted P5 (classify scale)

  # ── Unified Multi-Task Head ────────────────────────────────────────────
  # Input: [P3, P4, P5] from layers 16, 19, 22
  # Args are auto-filled by parse_model (nc, tasks, nm, npr, etc. from top-level YAML)
  - [[16, 19, 22], 1, MultiTaskHead, [nc]]  # 23
