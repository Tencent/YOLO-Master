# YOLOE-26-Master n 🚀 AGPL-3.0 License
# 开放词汇（YOLOEDetect + RepRTA）× ES-MoE（A2C2fMoE @ P3/P4/P5）
# 组合 yolo26-master-n.yaml 的 MoE backbone 与 yoloe-26.yaml 的开放词汇 head
# 参考：docs/adr/0007-yolo26-open-vocabulary-evolution.md（S2 阶段目标配置）

# Parameters
nc: 80 # number of classes（开放词汇训练时由 grounding 数据动态词表覆盖）
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
text_model: mobileclip2:b # YOLOE RepRTA 文本编码器
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# YOLOE-26-Master backbone（A2C2fMoE 替换 C3k2 @ P3/P4/P5）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, A2C2fMoE, [512, True, 1, False, 2.0, 0.5, 1, True, 4, 2]] # 4 - MoE at P3 (num_experts=4, top_k=2)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, A2C2fMoE, [512, True, 1, False, 2.0, 0.5, 1, True, 8, 2]] # 6 - MoE at P4 (num_experts=8, top_k=2)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, A2C2fMoE, [1024, True, 1, False, 2.0, 0.5, 1, True, 16, 2]] # 8 - MoE at P5 (num_experts=16, top_k=2)
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLOE-26-Master head（PAN 结构同 yoloe-26，末端换 YOLOEDetect）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 - cat backbone P4 (A2C2fMoE at layer 6)
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 - cat backbone P3 (A2C2fMoE at layer 4)
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18 - cat head P4
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21 - cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, YOLOEDetect, [nc, 512, True]] # YOLOEDetect(P3, P4, P5)
