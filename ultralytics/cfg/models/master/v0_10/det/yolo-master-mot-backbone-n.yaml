# YOLO-Master v0.10-MoT-Backbone AGPL-3.0 License - https://ultralytics.com/license
#
# Backbone-sited MoT with a plain neck.  C2fMoT replaces
# VisualEnhancedAdaptiveGateMoE at the P4 and P5 backbone junctions, the P3
# junction keeps its MoE block, and the neck is the plain C3k2 stack from the
# v0.10 baseline.  This is the counterpart to yolo-master-mot-n.yaml, which keeps
# MoE across the whole backbone and stacks MoT on top of it in the neck.
#
# Motivation (paper Sec. 4.3.1, Table 5): of four ES-MoE placements, backbone-only
# was best (+1.3% mAP), neck-only lost 2.6%, and backbone+neck together lost 5.9%
# -- attributed to gradient interference between cascaded routing mechanisms.
# Every routed variant trained here so far has been the cascaded case.  This
# config removes the backbone->neck cascade: all routing lives in the backbone and
# the neck is left dense.
#
# Why P3 keeps MoE instead of getting MoT
# ---------------------------------------
# _LocalConvTransformerExpert attends globally over all N = H*W tokens, so its
# attention matrix is O(N^2).  At 640x640 the P3/8 junction carries 80*80 = 6400
# tokens, i.e. ~41M attention entries per head; a first attempt to site MoT there
# died with `OutOfMemoryError: Tried to allocate 15.50 GiB` on a 24 GB card.  P4/16
# (1600 tokens) and P5/32 (400 tokens) are 16x and 100x cheaper and are already
# proven at this batch size by the neck-sited MoT arms.  Siting MoT at P3 would
# require rewriting the LocalConv expert to windowed or linear attention, which
# would also break comparability with the existing MoT runs.
#
# Layer indices 5 / 8 / 11 are preserved so the neck's Concat sources and the
# per-stage output channel widths stay identical to the baseline.
#
# C2fMoT is a repeat_module: the external repeat is depth-scaled to produce the
# internal n (stacked MoTBlocks).  Do NOT pass n inside args.  repeat 2 at depth
# 0.50 yields n=1, matching the single MoE block each junction had before.

nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2

  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4

  - [-1, 1, VisualEnhancedAdaptiveGateMoE, [512, 4, 2, 0.5]]  # 5 - MoE at P3 (80x80: too many tokens for MoT)

  - [-1, 1, Conv, [512, 3, 2]]        # 6-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]    # 7

  - [-1, 2, C2fMoT, [512, 8, 2, 7, 4, 2.0, 1.0, 0.01, 0.5]]   # 8 - MoT at P4 (40x40)

  - [-1, 1, Conv, [1024, 3, 2]]       # 9-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]   # 10

  - [-1, 2, C2fMoT, [1024, 8, 2, 7, 4, 2.0, 0.8, 0.01, 0.5]]  # 11 - MoT at P5 (20x20)

# Neck identical to the v0.10 baseline: no routing here, by design.  This is the
# variable under test.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]         # cat backbone P4
  - [-1, 2, C3k2, [512, True]]        # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]         # cat backbone P3
  - [-1, 2, C3k2, [256, True]]        # 17

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]        # cat head P4
  - [-1, 2, C3k2, [512, True]]        # 20

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]        # cat head P5
  - [-1, 2, C3k2, [512, True]]        # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]]   # Detect(P3, P4, P5)
