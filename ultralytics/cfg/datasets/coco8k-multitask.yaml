# COCO8k-MultiTask — 8k 张 COCO 图像的多任务训练（检测 + 分割）
# 从 COCO train2017 中取前 8000 张图作为训练集，val2017（5000张）作为验证集
#
# Example usage: yolo train data=coco8k-multitask.yaml model=yolo26-master-mt-n.yaml

# Train/val/test sets
path: coco        # dataset root, shared with full COCO
train: train8k.txt  # 8000 images subset from train2017
val: val2017.txt    # 5000 images from val2017
test:  # optional

# Active multi-task pipeline
tasks:
  - detect
  - segment
  - pose
  - classify
  - depth
  - obb

# Keypoint shape (used when pose annotations exist; ignored otherwise)
kpt_shape: [17, 3]
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]

# Classes (full COCO 80 classes)
names:
