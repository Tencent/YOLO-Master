# COCO-MultiTask — full COCO 2017 (118k train) 多任务训练
# 有效任务: detect + segment + pose (由 COCO 原生 JSON 对齐提供)
# 休眠任务: classify/depth/obb (本数据源没有合法的图像级分类、深度或 OBB 监督)
#
# Example usage: yolo train data=coco-multitask.yaml model=yolo26-master-mt-n.yaml device=mps

# Train/val/test sets
path: coco
train: train2017.txt  # 118287 images from train2017
val: val2017.txt      # 5000 images from val2017
test:  # optional
multitask_format: coco
train_instances: annotations/instances_train2017.json
val_instances: annotations/instances_val2017.json
train_keypoints: annotations/person_keypoints_train2017.json
val_keypoints: annotations/person_keypoints_val2017.json

# Active multi-task pipeline
tasks:
  - detect
  - segment
  - pose

# Keypoint shape (used when pose annotations exist; ignored otherwise)
kpt_shape: [17, 3]
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]

# Classes (full COCO 80 classes)
