# COCO8-MultiTask dataset — unified multi-task training with detection, segmentation, and pose.
# Built on coco8-seg (which includes detection bboxes + segmentation masks).
# Pose and classification tasks are enabled but gracefully skip when annotations are absent.
#
# Example usage: yolo train data=coco8-multitask.yaml model=yolo26-master-mt-n.yaml

# Train/val/test sets
path: coco8-seg
train: images/train  # 4 images
val: images/val      # 4 images
test:  # optional

# Active multi-task pipeline
tasks:
  - detect
  - segment
  - pose
  - classify
  - depth
  - obb

# Keypoint shape (used when pose annotations exist; ignored otherwise)
kpt_shape: [17, 3]
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]

# Classes (shared across all tasks)
names:
