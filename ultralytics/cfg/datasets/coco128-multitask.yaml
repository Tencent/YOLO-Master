# COCO128-MultiTask — 128 张真实 COCO 图像的多任务训练（检测 + 分割）
# 基于 coco128-seg 数据集，包含检测框和分割掩码的真实标注。
# 额外启用的任务（pose/classify/depth/obb）在缺少标注时优雅跳过。
#
# Example usage: yolo train data=coco128-multitask.yaml model=yolo26-master-mt-n.yaml

# Train/val/test sets
path: coco128-seg
train: images/train2017  # 128 images from COCO train2017
val: images/train2017    # use same for val (small dataset)
test:  # optional

# Active multi-task pipeline
tasks:
  - detect
  - segment
  - pose
  - classify
  - depth
  - obb

# Keypoint shape (used when pose annotations exist; ignored otherwise)
kpt_shape: [17, 3]
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]

# Classes (full COCO 80 classes)
