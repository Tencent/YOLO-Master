# D2 P1-VOC 对照基线（KD off）
# 四格共享同一份 off 基线：每个 seed 只跑一次，四格都与它比较。
# 除 name 与末尾"唯一变量"区块外，本文件应与 configs/p1_voc/ 下其余四份逐字相同。
# 改动其余任何一行都会使整个 2x2 对照失效。
model: ultralytics/cfg/models/26/yolo26-master-n.yaml
data: VOC.yaml
task: detect
mode: train

# ---- 预算与优化：五份配置必须完全一致 ----
epochs: 400
imgsz: 256
batch: 64
workers: 32
optimizer: SGD
lr0: 0.01
lrf: 0.01
warmup_epochs: 3.0
pretrained: false
amp: false

# ---- 可复现性（seed 由命令行覆盖为 17 / 29 / 43）----
seed: 17
deterministic: true

# ---- 评测与产物 ----
val: true
plots: true
save: true
project: d2/p1voc
name: off-s17

# ---- 唯一变量：Foundation 蒸馏配置 ----
foundation_enabled: false
foundation_teacher: none
foundation_model:
foundation_loss_weight: 0.0

# 以下字段在 off 组中不生效（loss_weight=0 时 wrapper 直接返回原学生，
# 见 foundation_distill_model.py:1451），但仍显式写出以便逐字段核对。
foundation_backend: transformers
foundation_target_levels: [p4]
foundation_multiscale: false
foundation_align_dim: 256
foundation_loss: relational
foundation_foreground_weighting: false
foundation_weight_schedule: constant
