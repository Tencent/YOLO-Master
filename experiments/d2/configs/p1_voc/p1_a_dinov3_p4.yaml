# D2 P1-VOC 格 A｜DINOv3 × P4 单尺度
# 教师 patch 16 与学生 P4 stride 16 原生同格，零插值。四格中唯一无插值误差源的一格。
# 除 name 与末尾"唯一变量"区块外，本文件应与 configs/p1_voc/ 下其余四份逐字相同。
# 改动其余任何一行都会使整个 2x2 对照失效。
model: ultralytics/cfg/models/26/yolo26-master-n.yaml
data: VOC.yaml
task: detect
mode: train

# ---- 预算与优化：五份配置必须完全一致 ----
epochs: 400
imgsz: 256
batch: 64
workers: 32
optimizer: SGD
lr0: 0.01
lrf: 0.01
warmup_epochs: 3.0
pretrained: false
amp: false

# ---- 可复现性（seed 由命令行覆盖为 17 / 29 / 43）----
seed: 17
deterministic: true

# ---- 评测与产物 ----
val: true
plots: true
save: true
project: d2/p1voc
name: a-s17

# ---- 唯一变量：Foundation 蒸馏配置 ----
foundation_enabled: true
foundation_teacher: dinov3
foundation_model: facebook/dinov3-vits16-pretrain-lvd1689m
# 教师 revision（2026-08-26 的 main）: 114c1379950215c8b35dfcd4e90a5c251dde0d32
# 记录用；本仓库无 foundation_revision 配置项，见 limitations.md 2.3
foundation_loss_weight: 3.3427745950933323
foundation_backend: transformers
foundation_target_levels: [p4]
foundation_multiscale: false
foundation_align_dim: 256
foundation_loss: relational
foundation_foreground_weighting: false
foundation_weight_schedule: constant
